[package]
name = "ph-github"
description = "GitHub and GitHub Enterprise for PilotHouse: accounts (tokens in the OS keychain) and the REST API for pull requests, reviews, comments and checks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
anyhow.workspace = true
ph-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "gzip", "json"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[features]
# The local mock server, for other crates' tests.
testing = []
