[package]
name = "ph-utils"
description = "Offline developer utilities: formats, encodings, certificates, QR codes, hashes, ids, times, text, SQLite."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
jiff.workspace = true
markdown = "1"
md-5 = "0.11"
qrcode = { version = "0.14", default-features = false }
quick-xml = "0.42"
regex = "1"
roxmltree = "0.21"
rusqlite.workspace = true
serde_json.workspace = true
sha2 = "0.11"
similar.workspace = true
toml.workspace = true
url.workspace = true
x509-parser = { version = "0.18", default-features = false }
yaml-rust2 = { version = "0.13", default-features = false }
