[package]
name = "ph-preview"
description = "Viewers for files beyond plain text: Markdown with Mermaid, images, data trees, tables, notebooks, audio, video, PDF, databases, archives and fonts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
calamine = "0.37"
csv = "1.4"
flate2 = "1"
gpui-kit.workspace = true
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
json5 = "1.3"
markdown = "1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
ph-git.workspace = true
ph-ui.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tar = "0.4"
toml = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
ttf-parser = "0.25"
yaml-rust2 = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Sound plays through rodio on macOS and Windows; on Linux it only decodes
# (for the waveform) and GStreamer plays, so ALSA is not needed to start.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVTime", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSValue"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }
windows-core = "0.58"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "mp4", "vorbis", "wav"] }
