[package]
name = "ph-ui"
description = "Shared PilotHouse UI pieces: bundled icon assets and small presentational components."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ph-brand.workspace = true
anyhow.workspace = true
base64 = "0.23"
futures.workspace = true
gpui-kit.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
tracing.workspace = true
# The Markdown parser GPUI Kit renders with: copies made from a rendered
# document are written as HTML with it.
markdown = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
