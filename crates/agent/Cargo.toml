[package]
name = "ph-agent"
description = "Agent chat: runs coding-agent CLIs over the Agent Client Protocol and renders the conversation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ph-brand.workspace = true
agent-client-protocol-schema.workspace = true
anyhow.workspace = true
futures.workspace = true
gpui-kit.workspace = true
# A pasted image of a kind agents do not take (macOS often hands over TIFF)
# is turned into PNG.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "ico", "pnm"] }
# Mermaid diagrams in replies, drawn as SVG without a browser.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
ph-env.workspace = true
ph-files.workspace = true
ph-store.workspace = true
ph-git.workspace = true
ph-theme.workspace = true
toml.workspace = true
ph-review.workspace = true
# Antigravity's past sessions are in a SQLite file of its own.
rusqlite.workspace = true
ph-ui.workspace = true
dirs.workspace = true
jiff.workspace = true
# Lines of the agents' usage files matched as bytes before parsing.
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
smol.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
