# Shortcuts for development. Every alias builds into the shared `target/`
# directory with the same feature set, so builds reuse each other's artifacts.
[alias]
# Run the app with the dev automation socket (ui.click, ui.screenshot, ...).
dev = "run -p pilothouse --features automation"
# Build the dev binary without running it.
dev-build = "build -p pilothouse --features automation"
# Line and function coverage of the tests, as pages in target/llvm-cov/html.
# Needs `cargo install cargo-llvm-cov` and `rustup component add
# llvm-tools-preview`. A run builds what it covers once more, instrumented,
# in target/llvm-cov-target: for the whole workspace that is tens of GB, so
# `cargo coverage -p ph-store` (one crate) is the usual way to look.
coverage = "llvm-cov --features pilothouse/automation --no-fail-fast --html"
# The same as a table in the terminal (per file: regions, functions, lines).
coverage-summary = "llvm-cov --features pilothouse/automation --no-fail-fast --summary-only"
