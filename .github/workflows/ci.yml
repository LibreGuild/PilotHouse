name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: CI never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # These names are the required status checks on `main`; keep them stable.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux — fmt, clippy, tests
            os: ubuntu-latest
          - name: Windows — clippy, tests
            os: windows-latest
          - name: macOS — clippy, tests
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Actions are pinned to commits; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # GPUI's Linux backends (X11 and Wayland, Vulkan, fonts).
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libdbus-1-dev pkg-config

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features pilothouse/automation -- -D warnings
      - name: Tests
        run: cargo test --workspace --features pilothouse/automation
      - name: Release build
        run: cargo build --release -p pilothouse

      # CI machines are slower and noisier than a laptop, so the budget check
      # reports here but does not fail the build. Run it locally to enforce it.
      - name: Performance budget (informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: scripts/perf.sh target/release/pilothouse
