name: Release

# A tag `vX.Y.Z` (matching Cargo.toml) builds and publishes that release.
# Started by hand on a branch, it only builds the installers (a check before
# merging).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the build jobs may attest, only `publish` writes.
# `publish` and `mirror` run in the `release` environment, whose secrets (the
# update signing key, the R2 upload token) only `v*` tags can use.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          version=$(scripts/package/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi

  macos:
    name: macOS (universal DMG)
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: scripts/package/macos.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (installer, portable)
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: scripts/package/windows.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb, tarball)
    needs: plan
    # The oldest supported system: the binary runs on this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libdbus-1-dev pkg-config file desktop-file-utils
      - name: Build
        run: scripts/package/linux.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      # Whether this build updates itself (brand/brand.toml [updates]): a
      # build whose brand turns updates off ships no update manifest.
      - name: Brand
        id: brand
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("source/brand/brand.toml", "rb") as file:
              print("updates=" + str(tomllib.load(file)["updates"]["enabled"]).lower())
          EOF
      # What the updater reads: the version and each install's file.
      - name: Update manifest
        if: steps.brand.outputs.updates == 'true'
        run: python3 source/scripts/package/latest-json.py "$VERSION" "$GITHUB_REF_NAME" "$GH_REPO" dist > dist/latest.json && cat dist/latest.json
      # The updater uses latest.json only with the release key's signature,
      # wherever it is fetched from (GitHub or a mirror).
      - name: Sign manifest
        if: steps.brand.outputs.updates == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: source/scripts/package/sign-manifest.sh dist/latest.json
      - name: Release notes
        run: |
          set -euo pipefail
          echo "PilotHouse ${VERSION/-/ }." > notes.md
          cat >> notes.md <<'NOTES'

          ## Downloads

          | System | File |
          |---|---|
          | macOS 11+ (Apple silicon and Intel) | `PilotHouse-macOS-universal.dmg`: drag PilotHouse to Applications |
          | Windows 10/11 (x64) | `PilotHouse-Windows-Setup-x64.exe` (for your user, no admin), or `PilotHouse-Windows-Portable-x64.zip` |
          | Ubuntu 22.04+ / Debian 12+ | `PilotHouse-Linux-amd64.deb`: `sudo apt install ./PilotHouse-Linux-amd64.deb` |
          | Any Linux (x86-64) | `PilotHouse-Linux-x86_64.AppImage` (`chmod +x` and run) or `PilotHouse-Linux-x86_64.tar.gz` |

          PilotHouse updates itself from these releases or the mirrors below (`latest.json`, signed with the release key in `latest.json.sig`, and `PilotHouse-macOS-universal.zip` on macOS); the `.deb` is updated by installing the new one.

          The builds are not code-signed. **macOS:** the first open is blocked; open System Settings → Privacy & Security → **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/PilotHouse.app`. **Windows:** if SmartScreen appears, choose **More info → Run anyway**.

          Check a download: `SHA256SUMS` lists every file's checksum, and `gh attestation verify <file> -R LibreGuild/PilotHouse` shows it was built by this repository's workflow.
          NOTES
          printf '\n**Mirrors:**\n\n- `https://libreguild.skatech.org/pilothouse/releases/%s/<file>`\n- `https://pub-6c540d377bd4404f87ff33fb14c18c21.r2.dev/pilothouse/releases/%s/<file>`\n' \
            "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> notes.md
      - name: Publish
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            # A version with a suffix (1.0.0-beta) is a pre-release, never the latest.
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --latest=false \
              --title "PilotHouse ${VERSION/-/ }" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
              --title "PilotHouse $VERSION" --notes-file notes.md
          fi

  # The same files on Cloudflare R2, for networks where GitHub is blocked:
  # `pilothouse/releases/<tag>/` keeps every release (where latest.json points
  # the updater), `pilothouse/latest/` the newest one (what the site links to,
  # and the updater's latest.json). Served at libreguild.skatech.org and the
  # bucket's r2.dev address. The upload token can only write this bucket.
  mirror:
    name: Mirror to R2
    needs: [plan, publish]
    # PilotHouse's own mirrors: a copy of the repository elsewhere (an
    # organisation's build) skips this job.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'LibreGuild/PilotHouse'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUCKET: s3://libreguild/pilothouse
    steps:
      # What is mirrored is exactly what GitHub has, checked against its checksums.
      - name: Release files
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --dir dist
          cd dist
          sha256sum --check --strict SHA256SUMS
          test -s latest.json.sig
          ls -l
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          # R2 does not take the newer default checksum headers of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          # A release's own files never change.
          aws s3 cp dist "$BUCKET/releases/$GITHUB_REF_NAME/" --recursive --no-progress \
            --cache-control "public, max-age=31536000, immutable"
          if [[ "$VERSION" == *-* ]]; then
            echo "A pre-release: pilothouse/latest/ stays on the newest release."
            exit 0
          fi
          # The newest release, its manifest last: the files it names are
          # already in place when the updater reads it.
          aws s3 cp dist "$BUCKET/latest/" --recursive --no-progress \
            --exclude "latest.json" --exclude "latest.json.sig" \
            --cache-control "public, max-age=300"
          aws s3 cp dist/latest.json.sig "$BUCKET/latest/latest.json.sig" --no-progress \
            --cache-control "no-cache"
          aws s3 cp dist/latest.json "$BUCKET/latest/latest.json" --no-progress \
            --cache-control "no-cache" --content-type "application/json"
      - name: Check the mirrors
        run: |
          set -euo pipefail
          for host in https://libreguild.skatech.org https://pub-6c540d377bd4404f87ff33fb14c18c21.r2.dev; do
            curl -fsS -o /dev/null "$host/pilothouse/releases/$GITHUB_REF_NAME/SHA256SUMS"
            echo "$host serves $GITHUB_REF_NAME"
          done
