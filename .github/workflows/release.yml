name: Release

# A tag `vX.Y.Z` (matching Cargo.toml) builds and publishes that release.
# Once a day, when `main` has moved since the last nightly, a "nightly"
# pre-release is built from it; it can also be started by hand. Started on
# another branch, it only builds the installers (a check before merging).
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the build jobs may attest, only `publish` writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Version and channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      build: ${{ steps.plan.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          version=$(scripts/package/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
              exit 1
            fi
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "channel=nightly" >> "$GITHUB_OUTPUT"
          # A scheduled run builds only when main moved since the last nightly.
          nightly=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || echo none)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$nightly" = "$GITHUB_SHA" ]; then
            echo "The nightly already has ${GITHUB_SHA::7}: nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS (universal DMG)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: scripts/package/macos.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (installer, portable)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: scripts/package/windows.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb, tarball)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The oldest supported system: the binary runs on this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libdbus-1-dev pkg-config file desktop-file-utils
      - name: Build
        run: scripts/package/linux.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, macos, windows, linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            echo "PilotHouse ${VERSION/-/ }." > notes.md
          else
            printf 'A preview built from `main` (commit %s). For everyday use, take the [latest release](https://github.com/%s/releases/latest).\n' \
              "${GITHUB_SHA::7}" "$GH_REPO" > notes.md
          fi
          cat >> notes.md <<'NOTES'

          ## Downloads

          | System | File |
          |---|---|
          | macOS 11+ (Apple silicon and Intel) | `PilotHouse-macOS-universal.dmg`: drag PilotHouse to Applications |
          | Windows 10/11 (x64) | `PilotHouse-Windows-Setup-x64.exe` (for your user, no admin), or `PilotHouse-Windows-Portable-x64.zip` |
          | Ubuntu 22.04+ / Debian 12+ | `PilotHouse-Linux-amd64.deb`: `sudo apt install ./PilotHouse-Linux-amd64.deb` |
          | Any Linux (x86-64) | `PilotHouse-Linux-x86_64.AppImage` (`chmod +x` and run) or `PilotHouse-Linux-x86_64.tar.gz` |

          The builds are not code-signed. **macOS:** the first open is blocked; open System Settings → Privacy & Security → **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/PilotHouse.app`. **Windows:** if SmartScreen appears, choose **More info → Run anyway**.

          Check a download: `SHA256SUMS` lists every file's checksum, and `gh attestation verify <file> -R LibreGuild/PilotHouse` shows it was built by this repository's workflow.
          NOTES
      - name: Publish
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ] && [[ "$VERSION" == *-* ]]; then
            # A beta (0.1.0-beta) is a pre-release, never the latest.
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --latest=false \
              --title "PilotHouse ${VERSION/-/ }" --notes-file notes.md
          elif [ "$CHANNEL" = stable ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
              --title "PilotHouse $VERSION" --notes-file notes.md
          else
            # Replace the previous nightly, its tag moved to this commit.
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "PilotHouse nightly (${GITHUB_SHA::7})" --notes-file notes.md
          fi
