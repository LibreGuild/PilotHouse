name: Release

# A tag `vX.Y.Z` (matching Cargo.toml) builds and publishes that release.
# Started by hand on a branch, it only builds the installers (a check before
# merging).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the build jobs may attest, only `publish` writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          version=$(scripts/package/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi

  macos:
    name: macOS (universal DMG)
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner's disk is mostly SDKs this build never uses; two release
      # builds and the disk image need the room (0.3.0's first try ran out).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "$HOME/Library/Android" \
            /usr/local/share/dotnet "$HOME/.dotnet" /usr/local/lib/node_modules || true
          df -h /
      - name: Build
        run: scripts/package/macos.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (installer, portable)
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: scripts/package/windows.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb, tarball)
    needs: plan
    # The oldest supported system: the binary runs on this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libdbus-1-dev pkg-config file desktop-file-utils
      - name: Build
        run: scripts/package/linux.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      # What PilotHouse's updater reads: the version and each install's file.
      - name: Update manifest
        run: python3 source/scripts/package/latest-json.py "$VERSION" "$GITHUB_REF_NAME" "$GH_REPO" dist > dist/latest.json && cat dist/latest.json
      - name: Release notes
        run: |
          set -euo pipefail
          echo "PilotHouse ${VERSION/-/ }." > notes.md
          cat >> notes.md <<'NOTES'

          ## Downloads

          | System | File |
          |---|---|
          | macOS 11+ (Apple silicon and Intel) | `PilotHouse-macOS-universal.dmg`: drag PilotHouse to Applications |
          | Windows 10/11 (x64) | `PilotHouse-Windows-Setup-x64.exe` (for your user, no admin), or `PilotHouse-Windows-Portable-x64.zip` |
          | Ubuntu 22.04+ / Debian 12+ | `PilotHouse-Linux-amd64.deb`: `sudo apt install ./PilotHouse-Linux-amd64.deb` |
          | Any Linux (x86-64) | `PilotHouse-Linux-x86_64.AppImage` (`chmod +x` and run) or `PilotHouse-Linux-x86_64.tar.gz` |

          PilotHouse updates itself from these releases (`latest.json`, and `PilotHouse-macOS-universal.zip` on macOS); the `.deb` is updated by installing the new one.

          The builds are not code-signed. **macOS:** the first open is blocked; open System Settings → Privacy & Security → **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/PilotHouse.app`. **Windows:** if SmartScreen appears, choose **More info → Run anyway**.

          Check a download: `SHA256SUMS` lists every file's checksum, and `gh attestation verify <file> -R LibreGuild/PilotHouse` shows it was built by this repository's workflow.
          NOTES
      - name: Publish
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            # A version with a suffix (1.0.0-beta) is a pre-release, never the latest.
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --latest=false \
              --title "PilotHouse ${VERSION/-/ }" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
              --title "PilotHouse $VERSION" --notes-file notes.md
          fi
