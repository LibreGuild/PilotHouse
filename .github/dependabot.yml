# Security and version updates for Rust crates and GitHub Actions, weekly.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The RustCrypto crates share the `digest` traits: they move together.
      rustcrypto:
        patterns: [digest, hmac, md-5, sha1, sha2]
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
